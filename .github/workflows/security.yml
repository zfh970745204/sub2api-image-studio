name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install pip-audit pip-licenses
      - run: pip-audit --requirement backend/constraints.lock
      - run: pip-licenses --fail-on="GPL-3.0-only;AGPL-3.0-only"
      - run: npm ci --prefix frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high
      - run: npx --yes license-checker-rseidelsohn@4.4.2 --start frontend --production --failOn "GPL-3.0-only;AGPL-3.0-only"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
