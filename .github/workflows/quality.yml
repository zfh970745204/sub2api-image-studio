name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sub2image_test
          POSTGRES_USER: sub2image
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2image -d sub2image_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sub2image:integration-only-password@127.0.0.1:5432/sub2image_test
      TEST_DATABASE_URL: postgresql+asyncpg://sub2image:integration-only-password@127.0.0.1:5432/sub2image_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: integration-access-key
      TEST_S3_SECRET_KEY: integration-secret-key
      TEST_S3_BUCKET: sub2image-test-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/constraints.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - run: npm ci --prefix frontend
      - name: Start disposable MinIO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download RELEASE.2025-04-22T22-12-26Z \
            --repo minio/minio \
            --pattern minio.linux-amd64.RELEASE.2025-04-22T22-12-26Z \
            --output "$RUNNER_TEMP/minio"
          echo "53e2a2cb16c5366ea6fbbc479c19ddb4c6a0948273e752f740fb1fbf27bb817c  $RUNNER_TEMP/minio" | sha256sum --check
          chmod +x "$RUNNER_TEMP/minio"
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup env MINIO_ROOT_USER="$TEST_S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$TEST_S3_SECRET_KEY" \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address :9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 < /dev/null &
      - name: Wait for MinIO
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: bash deploy/test-update-server.sh
      - shell: pwsh
        run: ./scripts/quality-check.ps1 -Integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.json
