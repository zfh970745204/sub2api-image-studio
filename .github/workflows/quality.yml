name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sub2image_test
          POSTGRES_USER: sub2image
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sub2image -d sub2image_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://sub2image:integration-only-password@127.0.0.1:5432/sub2image_test
      TEST_DATABASE_URL: postgresql+asyncpg://sub2image:integration-only-password@127.0.0.1:5432/sub2image_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      TEST_S3_ENDPOINT: http://127.0.0.1:9000
      TEST_S3_ACCESS_KEY: integration-access-key
      TEST_S3_SECRET_KEY: integration-secret-key
      TEST_S3_BUCKET: sub2image-test-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/constraints.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install --constraint backend/constraints.lock -e "./backend[dev]"
      - run: npm ci --prefix frontend
      - name: Start disposable MinIO
        run: >-
          docker run --detach --name sub2image-minio --publish 9000:9000
          --env MINIO_ROOT_USER=integration-access-key
          --env MINIO_ROOT_PASSWORD=integration-secret-key
          quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
      - name: Wait for MinIO
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          docker logs sub2image-minio
          exit 1
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - shell: pwsh
        run: ./scripts/quality-check.ps1 -Integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.json
