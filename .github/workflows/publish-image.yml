name: Publish production image

on:
  workflow_run:
    workflows: ["Quality gates"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: production-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Require matching security checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for attempt in {1..60}; do
            state="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/security.yml/runs?event=push&head_sha=${BUILT_SHA}&per_page=10" \
              --jq '[.workflow_runs[] | select(.head_sha == env.BUILT_SHA)][0] | if .status == "completed" then .conclusion else .status end')"
            if [ "${state}" = "success" ]; then
              echo "同一提交的安全检查已通过。"
              exit 0
            fi
            if [ "${state}" = "failure" ] || [ "${state}" = "cancelled" ] || [ "${state}" = "timed_out" ]; then
              echo "同一提交的安全检查未通过：${state}" >&2
              exit 1
            fi
            echo "等待安全检查完成：${state:-尚未创建}"
            sleep 10
          done
          echo "等待安全检查超时，停止发布。" >&2
          exit 1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Smoke test production worker imports
        run: >-
          docker run --rm
          ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          python -c "import cv2; from app.workers.worker import WorkerSettings;
          from app.workers.scheduler import SchedulerSettings;
          print(WorkerSettings.queue_name, SchedulerSettings.queue_name)"
      - name: Mirror the Redis runtime to GHCR
        run: |
          docker pull redis:7-alpine
          docker tag redis:7-alpine ghcr.io/${{ github.repository }}:redis-7-alpine
          docker push ghcr.io/${{ github.repository }}:redis-7-alpine
      - name: Promote verified image to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current_sha="$(gh api repos/${{ github.repository }}/commits/main --jq '.sha')"
          if [ "${current_sha}" != "${BUILT_SHA}" ]; then
            echo "main 已有更新提交，保留当前 latest，不推广旧镜像。"
            exit 0
          fi
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:sha-${BUILT_SHA}
