[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sub2image-backend"
version = "0.13.0"
description = "Local-first image workbench for Sub2API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "arq>=0.26,<1",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "opencv-python>=5.0,<6",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<6",
  "realesrgan-ncnn-py>=2.0,<3",
  "rembg[cpu]>=2.0.67,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.15,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "contract: API request, response, error, pagination, and authentication contracts",
  "integration: requires disposable PostgreSQL, Redis, or S3-compatible services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = [
  "app/domain",
  "app/catalog.py",
  "app/config.py",
  "app/storage.py",
  "app/sub2api.py",
  "app/services/security.py",
  "app/services/points.py",
  "app/services/memberships.py",
  "app/services/rbac.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
source = [
  "app.api.errors",
  "app.api.middleware",
  "app.catalog",
  "app.config",
  "app.repositories.models",
  "app.services.jobs",
  "app.services.memberships",
  "app.services.points",
  "app.services.rbac",
  "app.services.security",
  "app.storage",
  "app.sub2api",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
