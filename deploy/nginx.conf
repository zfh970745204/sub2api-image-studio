worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    upstream sub2image_web {
        server web:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 80m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'" always;

        location / {
            proxy_pass http://sub2image_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # The edge proxy owns the client address used by authentication throttling.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 65s;
        }
    }
}
